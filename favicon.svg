<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep green app tile -->
  <rect width="64" height="64" rx="14" fill="#123e30"/>

  <!-- Subtle flight trail -->
  <path
    d="M12 44
       C18 50 28 50 32 43
       C35 38 31 34 27 36
       C22 39 26 44 33 42
       C38 41 42 37 46 32"
    fill="none"
    stroke="#74b82f"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="2 5"
  />

  <!-- Paper plane -->
  <g transform="translate(27 10) rotate(5 16 16)">
    <path
      d="M3 14 L32 3 L22 33 L16 21 Z"
      fill="#ffc52e"
      stroke="#fffdf3"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Orange fold -->
    <path
      d="M16 21 L32 3 L22 26 Z"
      fill="#ff8b22"
      stroke="#123e30"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Lower fold -->
    <path
      d="M16 21 L13 29 L21 25"
      fill="#ffc52e"
      stroke="#123e30"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Main fold -->
    <path
      d="M16 21 L32 3"
      fill="none"
      stroke="#123e30"
      stroke-width="1.7"
      stroke-linecap="round"
    />
  </g>
</svg>
